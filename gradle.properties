org.gradle.jvmargs=-Xmx2048m
android.useAndroidX=true
android.nonTransitiveRClass=true
kotlin.code.style=official

# App version. Change these two values to release a new version.
# APP_VERSION_NAME is what users see (for example 1.2.0).
# APP_VERSION_CODE is the build number: a whole number that must go up with every release
# you publish (Play Store and Android both refuse a lower or equal number).
#For 1.1.0: 1001000
#For 1.1.1: 1001001
#For 1.2.0: 1002000
#For 2.0.0: 2000000

APP_VERSION_NAME=1.1.0
APP_VERSION_CODE=1001000
